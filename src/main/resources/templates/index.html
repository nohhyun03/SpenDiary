<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SpenDiary</title>
    <style>
        body {
            margin: 0;
            font-family: "Malgun Gothic", sans-serif;
            background: #f6f7f9;
            color: #20242a;
        }

        main {
            max-width: 720px;
            margin: 72px auto;
            padding: 32px;
            background: #ffffff;
            border: 1px solid #e1e5ea;
            border-radius: 8px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        p {
            line-height: 1.6;
        }

        a.button {
            display: inline-block;
            margin-top: 18px;
            margin-right: 8px;
            padding: 11px 16px;
            border-radius: 6px;
            background: #1f6feb;
            color: #ffffff;
            font-size: 15px;
            text-decoration: none;
        }

        button {
            margin-top: 18px;
            padding: 11px 16px;
            border: 0;
            border-radius: 6px;
            background: #20242a;
            color: #ffffff;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main>
    <h1>SpenDiary</h1>
    <p>
        <strong th:text="${loginUser.name}">사용자</strong>님, 로그인 테스트가 완료되었습니다.
    </p>

    <a class="button" href="/category/manage">카테고리 관리</a>

    <form action="/user/logout" method="post">
        <button type="submit">로그아웃</button>
    </form>
</main>
</body>
</html>
