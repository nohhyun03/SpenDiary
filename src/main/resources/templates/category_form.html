<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SpenDiary 카테고리 관리</title>
    <style>
        body {
            margin: 0;
            font-family: "Malgun Gothic", sans-serif;
            background: #f6f7f9;
            color: #20242a;
        }

        main {
            max-width: 920px;
            margin: 48px auto;
            padding: 32px;
            background: #ffffff;
            border: 1px solid #e1e5ea;
            border-radius: 8px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 30px;
        }

        h2 {
            margin: 28px 0 12px;
            font-size: 20px;
        }

        form {
            margin: 0;
        }

        .create-form {
            display: grid;
            grid-template-columns: 1fr 160px auto;
            gap: 10px;
            margin-bottom: 24px;
        }

        input, select {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #cfd6df;
            border-radius: 6px;
            font-size: 15px;
        }

        button, a.button {
            display: inline-block;
            padding: 10px 14px;
            border: 0;
            border-radius: 6px;
            background: #1f6feb;
            color: #ffffff;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        button.secondary {
            background: #20242a;
        }

        button.danger {
            background: #b42318;
        }

        .message {
            margin: 14px 0;
            padding: 12px;
            border-radius: 6px;
            background: #fff1f0;
            color: #b42318;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #edf0f3;
        }

        .update-form {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
        }

        .empty {
            color: #667085;
        }

        .top-link {
            margin-bottom: 20px;
        }

        @media (max-width: 720px) {
            main {
                margin: 24px 12px;
                padding: 20px;
            }

            .create-form, .grid, li {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main>
    <div class="top-link">
        <a href="/">홈으로</a>
    </div>

    <h1>카테고리 관리</h1>

    <div class="message" th:if="${error}" th:text="${error}">오류가 발생했습니다.</div>

    <form class="create-form" action="/category/create" method="post">
        <input name="name" type="text" placeholder="카테고리 이름" required>
        <select name="type" required>
            <option value="EXPENSE">지출</option>
            <option value="INCOME">수입</option>
        </select>
        <button type="submit">추가</button>
    </form>

    <div class="grid">
        <section>
            <h2>지출 카테고리</h2>
            <p class="empty" th:if="${#lists.isEmpty(expenseCategoryList)}">등록된 지출 카테고리가 없습니다.</p>
            <ul>
                <li th:each="category : ${expenseCategoryList}">
                    <form class="update-form" th:action="@{/category/update/{id}(id=${category.id})}" method="post">
                        <input name="name" type="text" th:value="${category.name}" required>
                        <button class="secondary" type="submit">수정</button>
                    </form>
                    <form th:action="@{/category/delete/{id}(id=${category.id})}" method="post">
                        <button class="danger" type="submit">삭제</button>
                    </form>
                </li>
            </ul>
        </section>

        <section>
            <h2>수입 카테고리</h2>
            <p class="empty" th:if="${#lists.isEmpty(incomeCategoryList)}">등록된 수입 카테고리가 없습니다.</p>
            <ul>
                <li th:each="category : ${incomeCategoryList}">
                    <form class="update-form" th:action="@{/category/update/{id}(id=${category.id})}" method="post">
                        <input name="name" type="text" th:value="${category.name}" required>
                        <button class="secondary" type="submit">수정</button>
                    </form>
                    <form th:action="@{/category/delete/{id}(id=${category.id})}" method="post">
                        <button class="danger" type="submit">삭제</button>
                    </form>
                </li>
            </ul>
        </section>
    </div>
</main>
</body>
</html>
