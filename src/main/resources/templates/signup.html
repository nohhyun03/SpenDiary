<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SpenDiary 회원가입</title>
    <style>
        body {
            margin: 0;
            font-family: "Malgun Gothic", sans-serif;
            background: #f6f7f9;
            color: #20242a;
        }

        main {
            max-width: 420px;
            margin: 72px auto;
            padding: 32px;
            background: #ffffff;
            border: 1px solid #e1e5ea;
            border-radius: 8px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 28px;
        }

        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: 700;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #cfd6df;
            border-radius: 6px;
            font-size: 15px;
        }

        button, a.button {
            display: inline-block;
            margin-top: 22px;
            padding: 11px 16px;
            border: 0;
            border-radius: 6px;
            background: #1f6feb;
            color: #ffffff;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        a {
            color: #1f6feb;
        }

        .message {
            margin: 14px 0;
            padding: 12px;
            border-radius: 6px;
        }

        .error {
            background: #fff1f0;
            color: #b42318;
        }
    </style>
</head>
<body>
<main>
    <h1>회원가입</h1>

    <div class="message error" th:if="${error}" th:text="${error}">회원가입 오류</div>

    <form action="/user/signup" method="post">
        <label for="loginId">아이디</label>
        <input id="loginId" name="loginId" type="text" required maxlength="30">

        <label for="name">이름</label>
        <input id="name" name="name" type="text" required maxlength="20">

        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" required>

        <label for="passwordConfirm">비밀번호 확인</label>
        <input id="passwordConfirm" name="passwordConfirm" type="password" required>

        <button type="submit">가입하기</button>
    </form>

    <p>이미 계정이 있나요? <a href="/user/login">로그인</a></p>
</main>
</body>
</html>
